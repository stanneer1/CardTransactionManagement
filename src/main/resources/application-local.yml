spring:
  datasource:
    url: jdbc:h2:mem:carddb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  security:
    user:
      name: admin
      password: admin123

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.cardtransaction: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95
      sla:
        http.server.requests: 200ms,500ms,1000ms
  endpoint:
    health:
      show-details: always

# Treasury API currency mappings (local overrides)
external:
  api:
    treasury:
      currency-mappings:
        USD: Dollar
        EUR: Euro
        GBP: Pound
        INR: Rupee
        JPY: Yen
        AUD: Dollar
        CAD: Dollar
        CHF: Franc
        CNY: Yuan

